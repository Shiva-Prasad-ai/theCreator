<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <!-- Primary Gradients -->
    <linearGradient id="full-cosmic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#9061F9"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="full-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="70%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A5F3FC"/>
    </linearGradient>
    <linearGradient id="ai-badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ==================== LOGO MARK ==================== -->
  <g transform="translate(6, 4)">
    <!-- Ambient Backdrop Glow -->
    <circle cx="36" cy="36" r="26" fill="#7C3AED" opacity="0.18" filter="url(#logo-glow)" />

    <!-- Outer Interlocking Creator Orbit Arc -->
    <path d="M 58 22 C 53 13 43 9 34 9 C 20 9 9 21 9 36 C 9 51 20 63 34 63 C 45 63 54 57 59 47" 
          stroke="url(#full-cosmic)" 
          stroke-width="5.5" 
          stroke-linecap="round" />

    <!-- Inner Dynamic Aperture Arc -->
    <path d="M 47 24 C 42 19 34 19 30 20 C 22 23 16 29 16 37 C 16 44 22 51 30 53 C 38 55 46 51 51 43" 
          stroke="url(#full-cyan)" 
          stroke-width="4" 
          stroke-linecap="round" />

    <!-- Central Neural Spark (AI Nexus) -->
    <g filter="url(#logo-glow)">
      <path d="M 41 36 L 36.5 32 L 32 36 L 36.5 40 Z" fill="#22D3EE" />
      <circle cx="36.5" cy="36" r="2" fill="#FFFFFF" />
    </g>

    <!-- Satellite Nodes -->
    <circle cx="58" cy="22" r="3" fill="#22D3EE" filter="url(#logo-glow)" />
    <circle cx="59" cy="47" r="3" fill="#7C3AED" />
    <circle cx="36.5" cy="36" r="7.5" stroke="url(#full-cyan)" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6"/>
  </g>

  <!-- ==================== TYPOGRAPHY ==================== -->
  <!-- "Creator" in Crisp White Space Grotesk styling -->
  <text x="82" y="47" 
        font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="700" 
        letter-spacing="-0.03em" 
        fill="#F8FAFC">Creator</text>

  <!-- "OS" in Violet to Cyan Gradient -->
  <text x="190" y="47" 
        font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="700" 
        letter-spacing="-0.03em" 
        fill="url(#full-cyan)">OS</text>

  <!-- "AI" Futuristic Glass Pill Badge -->
  <g transform="translate(236, 25)">
    <!-- Badge Background -->
    <rect x="0" y="0" width="46" height="26" rx="6" fill="url(#ai-badge-bg)" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.6" />
    <!-- AI Text -->
    <text x="23" y="18" 
          font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" 
          font-size="13" 
          font-weight="700" 
          letter-spacing="0.08em" 
          text-anchor="middle" 
          fill="#22D3EE" 
          filter="url(#logo-glow)">AI</text>
    <!-- Subtle top glow highlight -->
    <line x1="6" y1="2" x2="40" y2="2" stroke="#22D3EE" stroke-width="0.75" stroke-opacity="0.8" stroke-linecap="round"/>
  </g>

  <!-- Micro baseline tagline / descriptor -->
  <text x="83" y="63" 
        font-family="'Inter', system-ui, sans-serif" 
        font-size="8.5" 
        font-weight="500" 
        letter-spacing="0.18em" 
        fill="#AAB5CD" 
        opacity="0.85">NEXT-GEN CREATOR PLATFORM</text>
</svg>

