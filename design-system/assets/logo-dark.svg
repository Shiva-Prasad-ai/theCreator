<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" width="360" height="100" fill="none">
  <defs>
    <linearGradient id="dark-bg-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#263453" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="card-inner-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151C30"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="cosmic-p-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#9061F9"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="cyan-a-dark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="70%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A5F3FC"/>
    </linearGradient>
    <filter id="dark-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect x="2" y="2" width="356" height="96" rx="16" fill="url(#card-inner-grad)" stroke="url(#dark-bg-border)" stroke-width="1.5"/>

  <!-- Logo Mark -->
  <g transform="translate(18, 14)">
    <circle cx="36" cy="36" r="24" fill="#7C3AED" opacity="0.2" filter="url(#dark-glow)" />

    <path d="M 58 22 C 53 13 43 9 34 9 C 20 9 9 21 9 36 C 9 51 20 63 34 63 C 45 63 54 57 59 47" 
          stroke="url(#cosmic-p-dark)" 
          stroke-width="5.5" 
          stroke-linecap="round" />

    <path d="M 47 24 C 42 19 34 19 30 20 C 22 23 16 29 16 37 C 16 44 22 51 30 53 C 38 55 46 51 51 43" 
          stroke="url(#cyan-a-dark)" 
          stroke-width="4" 
          stroke-linecap="round" />

    <g filter="url(#dark-glow)">
      <path d="M 41 36 L 36.5 32 L 32 36 L 36.5 40 Z" fill="#22D3EE" />
      <circle cx="36.5" cy="36" r="2" fill="#FFFFFF" />
    </g>

    <circle cx="58" cy="22" r="3" fill="#22D3EE" filter="url(#dark-glow)" />
    <circle cx="59" cy="47" r="3" fill="#7C3AED" />
    <circle cx="36.5" cy="36" r="7.5" stroke="url(#cyan-a-dark)" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6"/>
  </g>

  <!-- Typography -->
  <text x="96" y="55" 
        font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="700" 
        letter-spacing="-0.03em" 
        fill="#F8FAFC">Creator</text>

  <text x="204" y="55" 
        font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="700" 
        letter-spacing="-0.03em" 
        fill="url(#cyan-a-dark)">OS</text>

  <g transform="translate(250, 33)">
    <rect x="0" y="0" width="46" height="26" rx="6" fill="#151C30" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.7" />
    <text x="23" y="18" 
          font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" 
          font-size="13" 
          font-weight="700" 
          letter-spacing="0.08em" 
          text-anchor="middle" 
          fill="#22D3EE">AI</text>
  </g>

  <text x="97" y="71" 
        font-family="'Inter', system-ui, sans-serif" 
        font-size="8.5" 
        font-weight="500" 
        letter-spacing="0.18em" 
        fill="#AAB5CD" 
        opacity="0.85">PREMIUM CREATOR SUITE</text>
</svg>

