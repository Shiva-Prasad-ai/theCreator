<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <!-- Primary Gradients -->
    <linearGradient id="cosmic-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="60%" stop-color="#9061F9"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="cyan-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="70%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A5F3FC"/>
    </linearGradient>
    <linearGradient id="orbit-ring" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="mark-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="core-glow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="5" result="blur2"/>
      <feComposite in="SourceGraphic" in2="blur2" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="40" cy="40" r="28" fill="#7C3AED" opacity="0.15" filter="url(#core-glow)" />

  <!-- Outer Interlocking Creator Orbit Arc -->
  <path d="M 64 24 C 58 14 47 10 38 10 C 22 10 10 23 10 40 C 10 57 22 70 38 70 C 50 70 60 63 65 52" 
        stroke="url(#cosmic-primary)" 
        stroke-width="6" 
        stroke-linecap="round" />

  <!-- Inner Dynamic Aperture Arc (Counter-flow) -->
  <path d="M 52 26 C 46 20 38 20 33 22 C 24 25 18 32 18 41 C 18 49 24 57 33 59 C 42 61 51 56 56 47" 
        stroke="url(#cyan-accent)" 
        stroke-width="4.5" 
        stroke-linecap="round" />

  <!-- Central Neural Spark (AI Core Nexus) -->
  <g filter="url(#mark-glow)">
    <!-- Core diamond star -->
    <path d="M 46 40 L 41 35 L 36 40 L 41 45 Z" fill="#22D3EE" />
    <circle cx="41" cy="40" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Telemetry Orbital Satellite Nodes -->
  <circle cx="64" cy="24" r="3.5" fill="#22D3EE" filter="url(#mark-glow)" />
  <circle cx="65" cy="52" r="3.5" fill="#7C3AED" />
  <circle cx="28" cy="19" r="2" fill="#A5F3FC" opacity="0.8" />
  <circle cx="41" cy="40" r="8" stroke="url(#cyan-accent)" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6"/>
</svg>

